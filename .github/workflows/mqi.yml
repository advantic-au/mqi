name: mqi

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

env:
  RUSTFLAGS: -Dwarnings

permissions:
  checks: write # For the clippy action  

jobs:
  client_check:
    strategy:
      fail-fast: false
      matrix:
        version:
          - client-version: 9.2.0.27
            feature: mqc_9_2_0_0
          - client-version: 9.3.1.0
            feature: mqc_9_3_1_0
          - client-version: 9.3.4.1
            feature: mqc_9_3_4_0
          - client-version: 9.4.1.0
            feature: mqc_9_4_1_0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: advantic-au/action-mq-client@stable
        id: mq-client
        with:
          client-version: ${{ matrix.version.client-version }}
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build"
      - name: Test
        run: cargo check --features ${{ matrix.version.feature }},pcf,mqai,dlopen2
        env:
          MQ_HOME: ${{ steps.mq-client.outputs.client-install-path }}
  pregen:
    strategy:
      fail-fast: false
      matrix:
        build:
          - os: windows-latest
            mq-version: 9.4.1.0
          - os: ubuntu-latest
            mq-version: 9.4.1.0
          - os: macos-latest
            mq-version: 9.4.1.0
    runs-on: ${{ matrix.build.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: advantic-au/action-mq-client@stable
        id: mq-client
        with:
          client-version: ${{ matrix.build.mq-version }}
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build"
      - name: Run build and refresh constants
        run: cargo build --no-default-features --features pregen
        env:
          MQ_HOME: ${{ steps.mq-client.outputs.client-install-path }}
      - name: Check for pregen changes
        run: git diff --stat --exit-code src/constants/mapping/pregen

  rustfmt-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: advantic-au/action-mq-client@stable
        id: mq-client
        with:
          client-version: 9.4.1.0

      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build"
      - name: Run rustfmt
        run: cargo fmt -- --check

      - name: Run clippy
        uses: auguwu/clippy-action@1.4.0
        env:
          MQ_HOME: ${{ steps.mq-client.outputs.client-install-path }}
        with:
          check-args: --tests --all-features
          token: ${{secrets.GITHUB_TOKEN}}

  minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: advantic-au/action-mq-client@stable
        id: mq-client
        with:
          client-version: 9.4.1.0

      # Re-resolve Cargo.lock with minimal versions
      - uses: dtolnay/rust-toolchain@nightly # -Z option only available on nightly
      - run: cargo generate-lockfile -Z minimal-versions
      # Now verify that `cargo check` works with respect to the oldest possible
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81
      - run: cargo check --locked --all-features
        env:
          MQ_HOME: ${{ steps.mq-client.outputs.client-install-path }}

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly # Required for cargo-docs-rs
      - uses: dtolnay/install@cargo-docs-rs
      - run: cargo docs-rs
