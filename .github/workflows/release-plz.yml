name: Release-plz

on:
  push:
    branches:
      - develop

permissions: {}

jobs:
  # Release unpublished packages.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: advantic-au/action-mq-client@34d47069ef76049a2689b2c8100457223d964102 # stable
        id: mq-client
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: Run release-plz
        uses: release-plz/action@6caa8d34f74d82b0dc76a18edd1cc3d6801c9baf # v0.5.143
        with:
          command: release
        env:
          MQ_HOME: ${{ steps.mq-client.outputs.client-install-path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Create a PR with the new versions and changelog, preparing the next release.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-24.04
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ }}
      - uses: advantic-au/action-mq-client@34d47069ef76049a2689b2c8100457223d964102 # stable
        id: mq-client
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: Run release-plz
        uses: release-plz/action@6caa8d34f74d82b0dc76a18edd1cc3d6801c9baf # v0.5.143
        with:
          command: release-pr
        env:
          MQ_HOME: ${{ steps.mq-client.outputs.client-install-path }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
