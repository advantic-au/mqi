name: Semver Compatibility Check

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  semver-check:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install Rust
      uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
      with:
        toolchain: stable

    - uses: taiki-e/install-action@288875dd3d64326724fa6d9593062d9f8ba0b131 # v2.67.30
      with:
        tool: cargo-semver-checks

    - name: Get merge base
      id: merge-base
      env:
        GITHUB_BASE_REF: ${{ github.base_ref }}
      run: echo "sha=$(git merge-base origin/${GITHUB_BASE_REF} HEAD)" >> $GITHUB_OUTPUT

    - name: Check semver compatibility
      id: semver
      run: |
        set +e
        output=$(cargo semver-checks check-release --color never --baseline-rev ${MERGE_BASE_SHA} 2>&1)
        exit_code=$?
        echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
        echo "output<<EOF" >> $GITHUB_OUTPUT
        echo "$output" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
      env:
        MERGE_BASE_SHA: ${{ steps.merge-base.outputs.sha }}

    - name: Find Comment
      uses: peter-evans/find-comment@fec22f13a3d7a949297e4b5f6b9f99a423eabba1
      id: fc
      with:
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: 'github-actions[bot]'
        body-includes: "## Semver Compatibility Check"

    - name: Comment PR
      uses: peter-evans/create-or-update-comment@cf911f109bd9a26f1d626a8c3276384ddec0e552
      with:
        issue-number: ${{ github.event.pull_request.number }}
        comment-id: ${{ steps.fc.outputs.comment-id }}
        edit-mode: replace
        body: |
          ## Semver Compatibility Check ${{ steps.semver.outputs.exit_code == '0' && '✅ PASS' || '❌ FAIL' }}
          
          ```
          ${{ steps.semver.outputs.output }}
          ```