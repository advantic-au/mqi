name: Semver Compatibility Check

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  semver-check:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: stable

    - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
      with:
        tool: cargo-semver-checks

    - name: Get merge base
      id: merge-base
      env:
        GITHUB_BASE_REF: ${{ github.base_ref }}
      run: echo "sha=$(git merge-base origin/${GITHUB_BASE_REF} HEAD)" >> $GITHUB_OUTPUT

    - name: Check semver compatibility
      id: semver
      run: |
        set +e
        output=$(cargo semver-checks check-release --color never --baseline-rev ${MERGE_BASE_SHA} 2>&1)
        exit_code=$?
        echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
        echo "output<<EOF" >> $GITHUB_OUTPUT
        echo "$output" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
      env:
        MERGE_BASE_SHA: ${{ steps.merge-base.outputs.sha }}

    - name: Find Comment
      uses: peter-evans/find-comment@808d9dc0a684752648d47fbaae7a80f046774200
      id: fc
      with:
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: 'github-actions[bot]'
        body-includes: "## Semver Compatibility Check"

    - name: Comment PR
      uses: peter-evans/create-or-update-comment@77730d20d2e302b7337fe12d2a669c6b21d578a9
      with:
        issue-number: ${{ github.event.pull_request.number }}
        comment-id: ${{ steps.fc.outputs.comment-id }}
        edit-mode: replace
        body: |
          ## Semver Compatibility Check ${{ steps.semver.outputs.exit_code == '0' && '✅ PASS' || '❌ FAIL' }}
          
          ```
          ${{ steps.semver.outputs.output }}
          ```