name: Semver Compatibility Check

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  semver-check:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install Rust
      uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
      with:
        toolchain: stable

    - uses: taiki-e/install-action@c07504cae06f832dc8de08911c9a9c5cddb0d2d3 # v2.56.13
      with:
        tool: cargo-semver-checks

    - name: Get merge base
      id: merge-base
      env:
        GITHUB_BASE_REF: ${{ github.base_ref }}
      run: echo "sha=$(git merge-base origin/${GITHUB_BASE_REF} HEAD)" >> $GITHUB_OUTPUT

    - name: Check semver compatibility
      id: semver
      run: |
        set +e
        output=$(cargo semver-checks check-release --color never --baseline-rev ${MERGE_BASE_SHA} 2>&1)
        exit_code=$?
        echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
        echo "output<<EOF" >> $GITHUB_OUTPUT
        echo "$output" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
      env:
        MERGE_BASE_SHA: ${{ steps.merge-base.outputs.sha }}

    - name: Find Comment
      uses: peter-evans/find-comment@dea07be07a47fa0c900a5779f04a7e1bd16162a7
      id: fc
      with:
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: 'github-actions[bot]'
        body-includes: "## Semver Compatibility Check"

    - name: Comment PR
      uses: peter-evans/create-or-update-comment@f7c845d742ddcc26436b9547b75f949bdcd3012a
      with:
        issue-number: ${{ github.event.pull_request.number }}
        comment-id: ${{ steps.fc.outputs.comment-id }}
        edit-mode: replace
        body: |
          ## Semver Compatibility Check ${{ steps.semver.outputs.exit_code == '0' && '✅ PASS' || '❌ FAIL' }}
          
          ```
          ${{ steps.semver.outputs.output }}
          ```