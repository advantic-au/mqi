name: Full Mutant Testing
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  mutants:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: advantic-au/action-mq-client@stable
        id: mq-client
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - uses: taiki-e/install-action@c5b1b6f479c32f356cc6f4ba672a47f63853b13b # v2.62.38
        with:
          tool: cargo-mutants
      - name: Mutant testing
        run: |
          cargo mutants -vV --in-place --all-features
        env:
          MQ_HOME: ${{ steps.mq-client.outputs.client-install-path }}
      - name: Artefact mutants.out
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mutants-out
          path: mutants.out
