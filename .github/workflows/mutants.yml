name: Full Mutant Testing
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  mutants:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: advantic-au/action-mq-client@stable
        id: mq-client
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@288875dd3d64326724fa6d9593062d9f8ba0b131 # v2.67.30
        with:
          tool: cargo-mutants
      - name: Mutant testing
        run: |
          cargo mutants -vV --in-place --all-features
        env:
          MQ_HOME: ${{ steps.mq-client.outputs.client-install-path }}
      - name: Artefact mutants.out
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mutants-out
          path: mutants.out
