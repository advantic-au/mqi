name: Test Coverage
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  test:
    name: "Coverage"
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: advantic-au/action-mq-client@c1a22a36eb8340308dce3d1f845d0e2d2bbde3ca # stable
        id: mq-client
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: nextest, cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Generate code coverage
        run: |
          cargo llvm-cov --no-report nextest --profile ci --features mqai,dlopen2,mqc_latest,mock
          cargo llvm-cov --no-report test --doc --features mqai,dlopen2,mqc_latest,mock
          cargo llvm-cov report --doctests --ignore-filename-regex "build/.+" --codecov --output-path coverage/codecov.json
          cargo llvm-cov report --doctests --ignore-filename-regex "build/.+"
        env:
          MQ_HOME: ${{ steps.mq-client.outputs.client-install-path }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage/codecov.json
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
