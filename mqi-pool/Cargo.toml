[package]
name = "mqi-pool"
version = "0.1.0"
description = "r2d2 connection pool adapter for mqi"
repository = "https://github.com/advantic-au/mqi"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
mqi = { path = "..", version = "0.3.0" }
libmqm-sys = { version = "0.11.0", default-features = false, features = ["link", "mqc_9_3_0_0"] }
r2d2 = "0.8.10"
